<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gpsp Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c1a;color:#e0e0e0;font-family:system-ui,sans-serif;padding:12px;max-width:1200px;margin:0 auto}
h1{font-size:1.2em;color:#8af;margin-bottom:10px;text-align:center}
nav{display:flex;gap:8px;margin-bottom:14px;justify-content:center}
nav a{color:#8af;text-decoration:none;padding:5px 14px;border:1px solid #334;border-radius:6px;font-size:.82em;transition:background .15s}
nav a:hover,nav a.active{background:#2a2a4a;border-color:#88f}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#121a2e;border:1px solid #293;border-radius:8px;padding:12px}
.card.full{grid-column:1/-1}
.card h2{font-size:.9em;color:#8af;margin-bottom:8px}
/* Stats bar */
.hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hdr .fps{font-size:1.6em;font-weight:bold;color:#6f6;font-family:monospace}
.hdr .sub{font-size:.75em;color:#888}
/* Chart */
.chart-wrap{position:relative;width:100%;height:180px;background:#0a0f1a;border:1px solid #1a2a3a;border-radius:4px;overflow:hidden}
canvas{width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:.72em}
.legend .item{display:flex;align-items:center;gap:4px}
.legend .swatch{width:10px;height:10px;border-radius:2px}
/* Stats table */
.st{width:100%;border-collapse:collapse;font-size:.78em;font-family:monospace;margin-top:8px}
.st td{padding:3px 6px;border-bottom:1px solid #1a2030}
.st td:first-child{color:#888;width:40%}
.st .v{text-align:right;color:#afa}
.st .p99{text-align:right;color:#fa8}
/* Settings */
.row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a2030}
.row:last-child{border-bottom:none}
.row label{color:#ccc;font-size:.82em}
.toggle{position:relative;width:42px;height:22px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .sl{position:absolute;inset:0;background:#333;border-radius:11px;transition:.2s}
.toggle .sl:before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:.2s}
.toggle input:checked+.sl{background:#2a5a2a}
.toggle input:checked+.sl:before{transform:translateX(20px);background:#afa}
select{background:#1a2030;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:.82em}
.msg{text-align:center;font-size:.75em;min-height:18px;margin-top:6px}
.msg.ok{color:#6f6}.msg.err{color:#f66}
/* ROM picker */
.rom-list{max-height:200px;overflow-y:auto;margin-top:6px}
.rom-list .rom{display:flex;align-items:center;justify-content:space-between;padding:7px 8px;border-bottom:1px solid #1a2030;cursor:pointer;transition:background .12s;font-size:.82em}
.rom-list .rom:hover{background:#1a2a4a}
.rom-list .rom:active{background:#2a3a5a}
.rom-list .rom .name{color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rom-list .rom .go{color:#8af;font-size:.75em;flex-shrink:0;margin-left:8px}
.rom-empty{color:#666;font-size:.78em;text-align:center;padding:16px 0}
.rom-loading{color:#888;font-size:.78em;text-align:center;padding:16px 0}
btn{background:#2a3a5a;color:#8af;border:1px solid #446;border-radius:4px;padding:4px 12px;font-size:.78em;cursor:pointer}
btn:hover{background:#3a4a6a}
/* Prof bars */
.prof-wrap{margin-top:6px}
.prof-row{display:flex;align-items:center;font-size:.75em;margin-bottom:0;cursor:pointer;padding:2px 0;transition:background .12s;border-radius:3px}
.prof-row:hover{background:#1a2a4a}
.prof-row .plbl{width:60px;color:#888;text-align:right;padding-right:6px;flex-shrink:0;font-size:.78em}
.prof-row .pbar-bg{flex:1;height:14px;background:#0a0f1a;border-radius:2px;overflow:hidden;position:relative}
.prof-row .pbar{height:100%;border-radius:2px;min-width:1px}
.prof-row .ppct{width:40px;text-align:right;color:#aaa;padding-left:4px;flex-shrink:0}
/* Mini chart for expanded metric */
.mini-chart{width:100%;height:50px;background:#0a0f1a;border:1px solid #1a2a3a;border-radius:3px;margin:2px 0 4px 0;display:none}
.mini-chart.open{display:block}
/* JIT cache section */
.cache-row{display:flex;align-items:center;font-size:.75em;margin-bottom:3px}
.cache-row .clbl{width:40px;color:#888;text-align:right;padding-right:6px;flex-shrink:0}
.cache-row .cbar-bg{flex:1;height:12px;background:#0a0f1a;border-radius:2px;overflow:hidden}
.cache-row .cbar{height:100%;border-radius:2px;transition:width .3s}
.cache-row .cval{width:80px;text-align:right;color:#aaa;padding-left:4px;flex-shrink:0;font-family:monospace}
.cnt-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:.75em;margin-top:4px;font-family:monospace}
.cnt-grid .ck{color:#888}.cnt-grid .cv{color:#afa;text-align:right}
/* Tooltip */
[data-tip]{position:relative;cursor:help;border-bottom:1px dotted #556}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 6px);background:#1a2040;color:#dde;border:1px solid #446;border-radius:5px;padding:6px 10px;font-size:12px;font-family:system-ui,sans-serif;white-space:pre-line;width:max-content;max-width:300px;z-index:100;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.5);line-height:1.4}
[data-tip]:hover::before{content:'';position:absolute;left:12px;bottom:calc(100% + 2px);border:4px solid transparent;border-top-color:#446;z-index:101;pointer-events:none}
.cnt-grid [data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
.cnt-grid [data-tip]:hover::before{bottom:auto;top:calc(100% + 2px);border-top-color:transparent;border-bottom-color:#446}
/* Gamepad + Video panel */
.ctrl-panel{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.ctrl-video{text-align:center}
.ctrl-video canvas{image-rendering:pixelated;border:1px solid #334;border-radius:4px;background:#000;display:block;margin:0 auto}
.ctrl-pad{flex:0 0 auto}
.ctrl-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:.78em}
.ctrl-toolbar label{color:#ccc}
.ctrl-toolbar .tbtn{background:#2a3a5a;color:#8af;border:1px solid #446;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:.78em}
.ctrl-toolbar .tbtn:hover{background:#3a4a6a}
.ctrl-toolbar .tbtn.on{background:#2a5a2a;color:#afa;border-color:#4a6}
.ctrl-toolbar .tbtn.rec{background:#5a2a2a;color:#f88;border-color:#a44}
.vol-wrap{display:flex;align-items:center;gap:4px;font-size:.78em;color:#ccc}
.vol-wrap input[type=range]{width:80px;accent-color:#8af;cursor:pointer}
.vol-wrap .vol-val{width:28px;text-align:right;font-family:monospace;color:#afa;font-size:.82em}
/* ── GBA-style gamepad layout ── */
.gba-shell{background:#1a1830;border:2px solid #2a2848;border-radius:12px;padding:10px 12px 14px;margin:8px auto 0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
/* Row: L / R */
.gba-row{display:flex;justify-content:center;align-items:center;gap:10px}
.gba-row.top{justify-content:space-between;margin-bottom:8px;padding:0 8px}
.gba-row.mid{margin-bottom:8px}
.gba-row.bot{margin-top:8px}
.gba-sh .b{width:56px;height:26px;border-radius:4px 4px 8px 8px;background:#2a3a2a;border:2px solid #464;font-size:.72em;font-weight:bold;color:#afa;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .05s}
.gba-sh .b.active{background:#3a6a3a;border-color:#8f8;color:#fff}
/* D-pad */
.c-dpad{display:grid;grid-template:repeat(3,38px)/repeat(3,38px);gap:2px;flex-shrink:0}
.c-dpad .b{background:#2a2a4a;border:2px solid #444;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.9em;color:#aaa;transition:background .05s;cursor:pointer}
.c-dpad .b.active{background:#4a4a8a;border-color:#88f;color:#fff}
.c-dpad .e{visibility:hidden}
/* A / B */
.c-ab{display:flex;gap:10px;align-items:center;flex-shrink:0}
.c-ab .b{width:46px;height:46px;border-radius:50%;background:#5a2040;border:2px solid #844;font-size:1.05em;font-weight:bold;color:#fcc;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .05s}
.c-ab .b.active{background:#a03050;border-color:#f88;color:#fff}
/* Select / Start */
.gba-meta .b{width:56px;height:22px;border-radius:11px;background:#333;border:2px solid #555;font-size:.62em;font-weight:bold;color:#bbb;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .05s}
.gba-meta .b.active{background:#555;border-color:#aaa;color:#fff}
/* Screen — takes remaining space, bounded */
.gba-screen{flex:1;min-width:0;text-align:center;padding:0 10px}
.gba-screen canvas{image-rendering:pixelated;background:#000;border:2px solid #333;border-radius:4px;display:block;margin:0 auto;width:100%;max-width:480px;aspect-ratio:3/2}
.ws-status{font-size:.72em;padding:2px 8px;border-radius:10px;background:#333;display:inline-block;margin-top:4px}
.ws-status.ok{background:#1a4a1a;color:#6f6}
.ws-status.err{background:#4a1a1a;color:#f66}
.lang-btn{background:none;border:1px solid #446;border-radius:3px;color:#8af;padding:1px 6px;cursor:pointer;font-size:.7em;margin:0 2px;vertical-align:middle}
.lang-btn.active{background:#2a2a4a;color:#fff;border-color:#88f}
</style>
</head>
<body>
<h1>gpsp Console <span style="font-size:.6em;margin-left:12px"><button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button><button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button></span></h1>

<div class="grid">

<!-- Gamepad + Video panel -->
<div class="card full" id="ctrl_card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h2 style="margin:0" data-i18n="live_stream">实时推流</h2>
    <label class="toggle"><input type="checkbox" id="ctrl_enable"><span class="sl"></span></label>
  </div>
  <div id="ctrl_body" style="display:none">
    <div class="ctrl-toolbar">
      <button class="tbtn" id="stream_btn" data-i18n-title="start_stop_stream" title="开始/停止推流"><span data-i18n="stream_start">▶ 推流</span></button>
      <button class="tbtn" id="frame_once" data-i18n-title="capture_title" title="抓取一帧">📷 <span data-i18n="capture">截帧</span></button>
      <button class="tbtn" id="rec_btn" data-i18n-title="record_title" title="录制"><span data-i18n="record">⏺ 录制</span></button>
      <span class="vol-wrap">🔊 <span data-i18n="volume">音量</span><input type="range" id="vol_slider" min="0" max="100" value="100"><span class="vol-val" id="vol_val">100</span></span>
      <span style="color:#666;font-size:.72em" id="stream_info" data-i18n="not_connected">未连接</span>
      <span class="ws-status" id="ws_status">WS: --</span>
    </div>
    <div class="gba-shell" id="gba_shell">
      <!-- L / R -->
      <div class="gba-row top">
        <div class="gba-sh"><div class="b" data-key="9" id="ck9">L</div></div>
        <div class="gba-sh"><div class="b" data-key="8" id="ck8">R</div></div>
      </div>
      <!-- D-pad | Screen | A B -->
      <div class="gba-row mid">
        <div class="c-dpad">
          <div class="e"></div>
          <div class="b" data-key="6" id="ck6">▲</div>
          <div class="e"></div>
          <div class="b" data-key="5" id="ck5">◀</div>
          <div class="e"></div>
          <div class="b" data-key="4" id="ck4">▶</div>
          <div class="e"></div>
          <div class="b" data-key="7" id="ck7">▼</div>
          <div class="e"></div>
        </div>
        <div class="gba-screen">
          <canvas id="frame_cvs" width="240" height="160"></canvas>
          <div style="font-size:.65em;color:#666;margin-top:2px" id="frame_info" data-i18n="await_stream">等待推流...</div>
        </div>
        <div class="c-ab">
          <div class="b" data-key="1" id="ck1">B</div>
          <div class="b" data-key="0" id="ck0">A</div>
        </div>
      </div>
      <!-- Select / Start -->
      <div class="gba-row bot">
        <div class="gba-meta"><div class="b" data-key="2" id="ck2">SELECT</div></div>
        <div class="gba-meta"><div class="b" data-key="3" id="ck3">START</div></div>
      </div>
    </div>
  </div>
</div>

<div class="card full">
  <div class="hdr">
    <div><span class="fps" id="fps">--</span> <span class="sub">FPS</span></div>
    <div class="sub"><span data-i18n="free_mem">空闲内存</span>: <span id="heap">--</span> KB | <span data-i18n="frame_sync">帧同步</span>: <span id="acq">--</span> us | <span data-i18n="audio_prod">音频产出(GBA侧)</span>: <span id="snd">--</span> us | <span data-i18n="audio_cons">音频消费(I2S)</span>: <span id="i2s_buf">--</span></div>
  </div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>
  <div class="legend" id="legend"></div>
  <table class="st" id="tbl"></table>
</div>

<div class="card" id="prof_card" style="display:none">
  <h2><span data-i18n="cpu_prof_title" data-i18n-tip="cpu_prof_tip" data-tip="每帧CPU时间在各模块中的分配比例。点击任一指标可展开时间序列图">CPU 剖析 (cycles/frame)</span></h2>
  <div class="prof-wrap" id="prof_bars"></div>
  <table class="st" id="prof_tbl"></table>
</div>

<div class="card" id="jit_card" style="display:none">
  <h2><span data-i18n="jit_title" data-i18n-tip="jit_tip" data-tip="JIT动态重编译缓存的使用状态。GBA代码先编译为RISC-V本地代码存入缓存，之后可直接执行">JIT 缓存</span></h2>
  <div id="jit_cache_bars"></div>
  <div class="cnt-grid" id="jit_counts"></div>
</div>

<div class="card">
  <h2 data-i18n="settings">设置</h2>
  <div class="row">
    <label data-i18n="dynarec">动态重编译 (JIT)</label>
    <label class="toggle"><input type="checkbox" id="cfg_dynarec"><span class="sl"></span></label>
  </div>
  <div class="row">
    <label data-i18n="sprite_limit">精灵数量限制</label>
    <label class="toggle"><input type="checkbox" id="cfg_sprite"><span class="sl"></span></label>
  </div>
  <div class="row">
    <label data-i18n="boot_mode">启动模式</label>
    <select id="cfg_boot">
      <option value="game" data-i18n="boot_game">直接进入游戏</option>
      <option value="bios" data-i18n="boot_bios">BIOS 动画</option>
    </select>
  </div>
  <div class="row">
    <label data-i18n="serial_mode">连接线模式</label>
    <select id="cfg_serial">
      <option value="auto" data-i18n="serial_auto">自动</option>
      <option value="disabled" data-i18n="serial_off">关闭</option>
      <option value="rfu" data-i18n="serial_rfu">GBA 无线适配器</option>
      <option value="mul_poke" data-i18n="serial_poke">连接线 - 宝可梦模式</option>
      <option value="mul_aw1" data-i18n="serial_aw1">连接线 - 高级战争1模式</option>
      <option value="mul_aw2" data-i18n="serial_aw2">连接线 - 高级战争2模式</option>
    </select>
  </div>
  <div class="row">
    <label data-i18n="rtc_mode">RTC 时钟</label>
    <select id="cfg_rtc">
      <option value="auto" data-i18n="rtc_auto">自动</option>
      <option value="enabled" data-i18n="rtc_on">开启</option>
      <option value="disabled" data-i18n="rtc_off">关闭</option>
    </select>
  </div>
  <div class="row">
    <label data-i18n="frameskip">跳帧模式</label>
    <select id="cfg_frameskip">
      <option value="0" data-i18n="fs_off">关闭</option>
      <option value="1" data-i18n="fs_auto">自动</option>
      <option value="2" data-i18n="fs_auto_thr">自动 (阈值)</option>
      <option value="3" data-i18n="fs_fixed">固定间隔</option>
    </select>
  </div>
  <div class="row" id="row_fs_threshold" style="display:none">
    <label data-i18n="fs_threshold">跳帧阈值 (%)</label>
    <select id="cfg_fs_threshold">
      <option value="15">15%</option>
      <option value="20">20%</option>
      <option value="25">25%</option>
      <option value="30">30%</option>
      <option value="33">33%</option>
      <option value="40">40%</option>
      <option value="50">50%</option>
      <option value="60">60%</option>
      <option value="75">75%</option>
      <option value="80">80%</option>
      <option value="90">90%</option>
      <option value="95">95%</option>
    </select>
  </div>
  <div class="row" id="row_fs_interval" style="display:none">
    <label data-i18n="fs_interval">跳帧间隔</label>
    <select id="cfg_fs_interval">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <h2 data-i18n="netplay">联机</h2>
  <div class="row">
    <label data-i18n="netplay_mode_lbl">联机模式</label>
    <select id="cfg_np_mode" onchange="updateNetplayUI()" style="background:#1a2030;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:.82em">
      <option value="0" data-i18n-v="np_off">关闭</option>
      <option value="1" data-i18n-v="np_client">客户端 (直连)</option>
      <option value="2" data-i18n-v="np_host">主机 (等待连入)</option>
      <option value="3" data-i18n-v="np_tunnel">隧道客户端</option>
    </select>
  </div>
  <div class="row" id="row_np_host">
    <label data-i18n="netplay_host">主机地址</label>
    <input type="text" id="cfg_np_host" placeholder="192.168.1.x" style="background:#1a2030;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:.82em;width:140px">
  </div>
  <div class="row">
    <label data-i18n="netplay_port">端口</label>
    <input type="number" id="cfg_np_port" min="1" max="65535" style="background:#1a2030;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:.82em;width:80px">
  </div>
  <div class="row">
    <label data-i18n="netplay_nick">昵称</label>
    <input type="text" id="cfg_np_nick" maxlength="31" style="background:#1a2030;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:.82em;width:140px">
  </div>
  <div class="row" id="row_np_tunnel">
    <label data-i18n="netplay_tunnel_id">隧道 Session ID</label>
    <input type="text" id="cfg_np_tunnel" maxlength="24" placeholder="24位十六进制" style="background:#1a2030;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:.82em;width:200px;font-family:monospace">
  </div>
  <div class="msg" id="np_msg"></div>
</div>

<div class="card">
  <h2 data-i18n="games">游戏</h2>
  <div id="rom_list" class="rom-list"><div class="rom-loading" data-i18n="rom_loading">加载中...</div></div>
  <div class="msg" id="rom_msg"></div>
</div>

<div class="card">
  <h2 data-i18n="savestates">即时存档</h2>
  <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">
    <label style="font-size:.82em;color:#ccc" data-i18n="save_slot">存档槽:</label>
    <select id="st_slot" style="background:#1a2030;color:#e0e0e0;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:.82em">
      <option value="0">Slot 0</option><option value="1">Slot 1</option><option value="2">Slot 2</option>
      <option value="3">Slot 3</option><option value="4">Slot 4</option><option value="5">Slot 5</option>
      <option value="6">Slot 6</option><option value="7">Slot 7</option><option value="8">Slot 8</option>
      <option value="9">Slot 9</option>
    </select>
    <button id="st_save_btn" style="background:#2a5a2a;color:#afa;border:1px solid #4a6;border-radius:4px;padding:4px 12px;font-size:.78em;cursor:pointer" data-i18n="save_btn">保存</button>

(function(){
const $=id=>document.getElementById(id);
const FRAME_US = 16743;
const MAX_PTS = 60;

/* EMA-smoothed FPS display (alpha ≈ 0.15) to avoid 59.5/60.5 jitter */
let fpsEma = 0;
const FPS_ALPHA = 0.15;

/* Series config: key in JSON → label, color.
 * Drawn bottom-to-top in stacked area chart.
 * cpu includes render time, so the stack shows total then render
 * as a sub-portion within it. */
const SERIES = [
  {key:'cpu_only', label:'s_cpu_only', color:'#50c878'},
  {key:'render',   label:'s_render',   color:'#d9a84a'},
];

let history = [];  /* array of {ts, ...key: avg_us} */
let profHistory = []; /* array of prof objects */
let activeSeries = [];
let expandedMetric = null; /* currently expanded mini-chart key */

/* ── Chart ────────────────────────────────────────── */
const canvas = $('chart');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function resizeCanvas(){
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawChart(){
  const W = canvas.width / dpr, H = canvas.height / dpr;
  ctx.clearRect(0, 0, W, H);

  if (history.length < 2) return;

  const n = history.length;
  const dx = W / (MAX_PTS - 1);
  const yMax = FRAME_US * 1.25;  /* 125% headroom */
  const startX = (MAX_PTS - n) * dx;

  /* Grid lines at 25%, 50%, 75%, 100%, 125% (scaled to yMax=125%) */
  const pctY = pct => H - (pct / 125) * H;
  ctx.strokeStyle = '#1a2a3a';
  ctx.lineWidth = 0.5;
  for (let pct of [25, 50, 75, 125]) {
    const y = pctY(pct);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  /* 100% red dashed line */
  ctx.strokeStyle = '#e06060';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(0, pctY(100)); ctx.lineTo(W, pctY(100)); ctx.stroke();
  ctx.setLineDash([]);

  /* Right-side % labels */
  ctx.fillStyle = '#445';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  for (let pct of [25, 50, 75, 125]) {
    ctx.fillText(pct + '%', W - 2, pctY(pct) - 2);
  }
  ctx.fillStyle = '#e06060';
  ctx.fillText('100%', W - 2, pctY(100) - 2);

  /* Stacked area chart — draw from top series down so bottom series
   * visually appears at the bottom of the stack. */
  const ns = activeSeries.length;
  if (ns === 0) return;

  /* Compute cumulative sums per point for each layer */
  const cumY = [];  /* cumY[s][i] = cumulative value up to layer s */
  for (let s = 0; s < ns; s++) {
    cumY.push(new Float32Array(n));
    for (let i = 0; i < n; i++) {
      const prev = s > 0 ? cumY[s - 1][i] : 0;
      cumY[s][i] = prev + (history[i][activeSeries[s].key] || 0);
    }
  }

  /* Draw layers top-down so lower layers paint over upper layers */
  for (let s = ns - 1; s >= 0; s--) {
    const color = activeSeries[s].color;

    /* Filled area between this cumulative top and the baseline */
    ctx.beginPath();
    ctx.moveTo(startX, H);
    for (let i = 0; i < n; i++) {
      const x = startX + i * dx;
      const y = H - (cumY[s][i] / yMax) * H;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(startX + (n - 1) * dx, H);
    ctx.closePath();
    ctx.fillStyle = color + '90';
    ctx.fill();

    /* Top edge line */
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = startX + i * dx;
      const y = H - (cumY[s][i] / yMax) * H;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

/* ── Mini chart drawer ─────────────────────────────── */
function drawMiniChart(cvs, key, color) {
  if (profHistory.length < 2) return;
  const d = cvs.getContext('2d');
  const r = cvs.getBoundingClientRect();
  const dp = window.devicePixelRatio || 1;
  cvs.width = r.width * dp;
  cvs.height = r.height * dp;
  d.setTransform(dp, 0, 0, dp, 0, 0);

  const W = r.width, H = r.height;
  const n = profHistory.length;
  const dx = W / (MAX_PTS - 1);

  /* Find max value for auto-scale */
  let vMax = 0;
  for (let i = 0; i < n; i++) {
    const v = profHistory[i][key] || 0;
    if (v > vMax) vMax = v;
  }
  if (vMax === 0) vMax = 1;
  vMax *= 1.15; /* headroom */

  const startX = (MAX_PTS - n) * dx;

  /* Fill */
  d.beginPath();
  d.moveTo(startX, H);
  for (let i = 0; i < n; i++) {
    d.lineTo(startX + i * dx, H - ((profHistory[i][key] || 0) / vMax) * H);
  }
  d.lineTo(startX + (n - 1) * dx, H);
  d.closePath();
  d.fillStyle = color + '30';
  d.fill();

  /* Line */
  d.beginPath();
  for (let i = 0; i < n; i++) {
    const x = startX + i * dx;
    const y = H - ((profHistory[i][key] || 0) / vMax) * H;
    i === 0 ? d.moveTo(x, y) : d.lineTo(x, y);
  }
  d.strokeStyle = color;
  d.lineWidth = 1.5;
  d.stroke();

  /* Current value label */
  const cur = profHistory[n - 1][key] || 0;
  d.fillStyle = '#aaa';
  d.font = '9px monospace';
  d.textAlign = 'right';
  d.fillText(String(cur), W - 3, 10);
}

function profBar(metric, pct, p) {
  const id = 'mc_' + metric.key;
  const pad = metric.indent ? `padding-left:${metric.indent}px` : '';
  const tipAttr = metric.tip ? ` data-tip="${t(metric.tip)}"` : '';
  return `<div class="prof-row" style="${pad}" data-key="${metric.key}" data-color="${metric.color}">`
       + `<span class="plbl"${tipAttr}>${t(metric.label)}</span>`
       + `<div class="pbar-bg"><div class="pbar" style="width:${Math.min(pct,100)}%;background:${metric.color}"></div></div>`
       + `<span class="ppct">${pct}%</span></div>`
       + `<canvas class="mini-chart ${expandedMetric===metric.key?'open':''}" id="${id}"></canvas>`;

function countRow(metric, value) {
  const id = 'mc_' + metric.key;
  const tipAttr = metric.tip ? ` data-tip="${t(metric.tip)}"` : '';
  return `<div class="prof-row" data-key="${metric.key}" data-color="${metric.color}">`
       + `<span class="plbl"${tipAttr}>${t(metric.label)}</span>`

       + `<canvas class="mini-chart ${expandedMetric===metric.key?'open':''}" id="${id}"></canvas>`;
}

function getParentVal(p, metric) {
  if (!metric.parent) return p.total;
  return p[metric.parent] || 0;
}

function updateProf(data){
  const p = data.prof;
  const card = $('prof_card');
  if (!p || !p.total) { card.style.display='none'; return; }
  card.style.display='';

  /* Store prof history */
  profHistory.push(Object.assign({}, p));
  if (profHistory.length > MAX_PTS) profHistory.shift();

  const barsEl = $('prof_bars');
  let html = '';
  const pf = (v,d) => d > 0 ? (v / d * 100).toFixed(1) : '0.0';

  /* Cycle breakdown bars */
  for (const m of PROF_METRICS) {
    const parentVal = getParentVal(p, m);
    if (parentVal <= 0 && m.parent) continue;
    if ((p[m.key] || 0) === 0 && m.indent > 0) continue;
    html += profBar(m, pf(p[m.key]||0, parentVal), p);
  }

  /* Separator */
  html += '<div style="border-top:1px solid #1a2a3a;margin:6px 0"></div>';

  /* Count metrics */
  for (const m of COUNT_METRICS) {
    if (p[m.key] == null) continue;
    html += countRow(m, p[m.key]);
  }

  barsEl.innerHTML = html;

  /* Attach click handlers */
  barsEl.querySelectorAll('.prof-row').forEach(row => {
    row.addEventListener('click', function() {
      const key = this.dataset.key;
      const cvs = this.nextElementSibling;
      if (!cvs || !cvs.classList.contains('mini-chart')) return;
      if (expandedMetric === key) {
        expandedMetric = null;
        cvs.classList.remove('open');
      } else {
        /* Close previous */
        const prev = barsEl.querySelector('.mini-chart.open');
        if (prev) prev.classList.remove('open');
        expandedMetric = key;
        cvs.classList.add('open');
        drawMiniChart(cvs, key, this.dataset.color);
      }
    });
  });

  /* Redraw open mini chart if any */
  if (expandedMetric) {
    const mc = $('mc_' + expandedMetric);
    if (mc && mc.classList.contains('open')) {
      const row = mc.previousElementSibling;
      drawMiniChart(mc, expandedMetric, row ? row.dataset.color : '#8af');
    }
  }

  /* Info table: hit rate */
  let thtml = '';
  if (p.lkup_hit > 0 || p.lkup_miss > 0) {
    const hr = p.lkup_hit + p.lkup_miss > 0
      ? (p.lkup_hit / (p.lkup_hit + p.lkup_miss) * 100).toFixed(1) : '0';
    thtml += `<tr><td><span data-tip="${t('prof_hit_tip')}">${t('prof_hit')}</span></td><td class="v" colspan="2">${hr}%</td></tr>`;
  }
  $('prof_tbl').innerHTML = thtml;
}

/* ── JIT Cache utilization ───────────────────────── */
function updateJitCache(data) {
  const p = data.prof;
  const w = data.win;
  const c = data.cum;
  const card = $('jit_card');
  if (!p || !p.rom_cap) { card.style.display='none'; return; }
  card.style.display='';

  const bars = $('jit_cache_bars');
  const romPct = p.rom_cap > 0 ? (p.rom_used / p.rom_cap * 100).toFixed(1) : '0.0';
  const ramPct = p.ram_cap > 0 ? (p.ram_used / p.ram_cap * 100).toFixed(1) : '0.0';
  const romKB = (p.rom_used / 1024).toFixed(0);
  const romCapKB = (p.rom_cap / 1024).toFixed(0);
  const ramKB = (p.ram_used / 1024).toFixed(0);
  const ramCapKB = (p.ram_cap / 1024).toFixed(0);
  const romColor = romPct > 90 ? '#e06060' : romPct > 70 ? '#d9a84a' : '#50c878';
  const ramColor = ramPct > 90 ? '#e06060' : ramPct > 70 ? '#d9a84a' : '#50c878';

  let html =
    `<div class="cache-row"><span class="clbl">ROM</span>`
  + `<div class="cbar-bg"><div class="cbar" style="width:${romPct}%;background:${romColor}"></div></div>`
  + `<span class="cval">${romKB}/${romCapKB}K ${romPct}%</span></div>`
  + `<div class="cache-row"><span class="clbl">RAM</span>`
  + `<div class="cbar-bg"><div class="cbar" style="width:${ramPct}%;background:${ramColor}"></div></div>`
  + `<span class="cval">${ramKB}/${ramCapKB}K ${ramPct}%</span></div>`;

  /* ── Hot zone distribution ── */
  if (p.hot_wm > 0) {
    const hotKB = (p.hot_wm / 1024).toFixed(0);
    const coldKB = Math.max(0, (p.rom_used - p.hot_wm) / 1024).toFixed(0);
    const hotPct = p.rom_used > 0 ? (p.hot_wm / p.rom_used * 100).toFixed(1) : '0.0';
    const coldPct = p.rom_used > 0 ? (Math.max(0, p.rom_used - p.hot_wm) / p.rom_used * 100).toFixed(1) : '0.0';
    const hotW = p.rom_cap > 0 ? (p.hot_wm / p.rom_cap * 100).toFixed(1) : '0';
    const coldW = p.rom_cap > 0 ? (Math.max(0, p.rom_used - p.hot_wm) / p.rom_cap * 100).toFixed(1) : '0';
    html += `<div style="margin-top:8px;font-size:.72em;color:#888;margin-bottom:2px">`
         +  `<span data-tip="${t('j_hot_cold_tip')}">${t('j_hot_cold')}</span></div>`
         +  `<div class="cache-row"><span class="clbl"></span>`
         +  `<div class="cbar-bg" style="display:flex">`
         +  `<div class="cbar" style="width:${hotW}%;background:#d9a84a;flex-shrink:0"></div>`
         +  `<div class="cbar" style="width:${coldW}%;background:#4a90d9;flex-shrink:0"></div>`
         +  `</div>`
         +  `<span class="cval" style="width:auto;min-width:80px">${t('j_hot')}${hotKB}K ${t('j_cold')}${coldKB}K</span></div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.7em;margin-top:2px;padding-left:46px">`
         +  `<span><span style="color:#d9a84a">■</span> ${t('j_hot_zone')} ${hotPct}%</span>`
         +  `<span><span style="color:#4a90d9">■</span> ${t('j_cold_zone')} ${coldPct}%</span>`
         +  `<span style="color:#666" data-tip="${t('j_blocks_tip')}">${t('j_blocks')} ${p.hot_blk||0}</span>`
         +  `<span style="color:#666" data-tip="${t('j_age_tip')}">${t('j_alive')} ${p.hot_age||0}</span>`
         +  `</div>`;
  }

  /* ── Hot zone lifecycle ── */
  const hzA = p.hz_a || 0, hzB = p.hz_b || 0, hzS = p.hz_sok || 0;
  if (hzA + hzB > 0) {
    const totalFlush = hzA + hzB;
    const reuseRate = totalFlush > 0 ? (hzA / totalFlush * 100).toFixed(1) : '0';
    const freshS = c ? (c.hz_fresh_s || 0) : 0;
    const freshLabel = freshS < 60 ? `${freshS}s` : `${(freshS/60).toFixed(1)}m`;
    const freshColor = freshS < 60 ? '#6f6' : freshS < 300 ? '#d9a84a' : '#e06060';
    /* Avoided recompilation estimate: blocks preserved × Path A count */
    const avoidedBlocks = (p.hot_blk || 0) * hzA;
    html += `<div style="margin-top:8px;font-size:.72em;color:#888;margin-bottom:3px">`
         +  `<span data-tip="${t('j_lifecycle_tip')}">${t('j_lifecycle')}</span></div>`
         +  `<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.72em;font-family:monospace;padding-left:6px">`
         +  `<span data-tip="${t('j_retain_tip')}">${t('j_retain')} <span style="color:#6f6">${hzA}</span></span>`
         +  `<span data-tip="${t('j_rebuild_tip')}">${t('j_rebuild')} <span style="color:#e06060">${hzB}</span></span>`
         +  `<span data-tip="${t('j_fresh_tip')}">${t('j_fresh')} <span style="color:#afa">${hzS}</span></span>`
         +  `</div>`
         +  `<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.72em;font-family:monospace;padding-left:6px;margin-top:3px">`
         +  `<span data-tip="${t('j_reuse_tip')}">${t('j_reuse')} <span style="color:#8af">${reuseRate}%</span></span>`
         +  `<span data-tip="${t('j_since_tip')}">${t('j_since')} <span style="color:${freshColor}">${freshLabel}</span></span>`
         +  `<span data-tip="${t('j_avoided_tip')}">${t('j_avoided')} <span style="color:#afa">${avoidedBlocks}</span></span>`
         +  `</div>`;
  }

  bars.innerHTML = html;

  /* ── Window + Cumulative stats ── */
  const counts = $('jit_counts');
  let chtml = '';

  if (w && w.secs > 0) {
    const ws = w.secs;
    const wHr = (w.hr_x10 / 10).toFixed(1);
    const wXlatS = (w.xlat / ws).toFixed(1);
    const wFlRomS = (w.fl_rom / ws).toFixed(2);
    const wFlRamS = (w.fl_ram / ws).toFixed(2);
    const wIcS = (w.ic / ws).toFixed(1);
    const wLife = w.fl_rom > 0 ? (ws / w.fl_rom).toFixed(1) : '∞';
    chtml += `<div style="grid-column:1/-1;color:#888;font-size:.72em;margin-top:2px;border-top:1px solid #1a2a3a;padding-top:4px">`
          +  `<span data-tip="${t('w_window_tip').replace('%d',ws)}">${ws}${t('w_window')}</span></div>`
          +  `<span class="ck" data-tip="${t('w_hit_rate_tip')}">${t('w_hit_rate')}</span><span class="cv">${wHr}%</span>`
          +  `<span class="ck" data-tip="${t('w_compile_s_tip')}">${t('w_compile_s')}</span><span class="cv">${wXlatS}</span>`
          +  `<span class="ck" data-tip="${t('w_rom_flush_s_tip')}">${t('w_rom_flush_s')}</span><span class="cv">${wFlRomS}</span>`
          +  `<span class="ck" data-tip="${t('w_ram_flush_s_tip')}">${t('w_ram_flush_s')}</span><span class="cv">${wFlRamS}</span>`
          +  `<span class="ck" data-tip="${t('w_ic_sync_s_tip')}">${t('w_ic_sync_s')}</span><span class="cv">${wIcS}</span>`
          +  `<span class="ck" data-tip="${t('w_cache_life_tip')}">${t('w_cache_life')}</span><span class="cv">${wLife}s</span>`;
  }

  if (c) {
    const cHr = (c.hr_x10 / 10).toFixed(1);
    const cTotal = Number(c.hits) + Number(c.misses);
    chtml += `<div style="grid-column:1/-1;color:#888;font-size:.72em;margin-top:2px;border-top:1px solid #1a2a3a;padding-top:4px">`
          +  `<span data-tip="${t('cum_title_tip')}">${t('cum_title')}</span></div>`
          +  `<span class="ck" data-tip="${t('cum_hit_rate_tip')}">${t('cum_hit_rate')}</span><span class="cv">${cHr}% (${cTotal})</span>`
          +  `<span class="ck" data-tip="${t('cum_compile_tip')}">${t('cum_compile')}</span><span class="cv">${c.xlat}</span>`
          +  `<span class="ck" data-tip="${t('cum_rom_flush_tip')}">${t('cum_rom_flush')}</span><span class="cv">${c.fl_rom}</span>`
          +  `<span class="ck" data-tip="${t('cum_ram_flush_tip')}">${t('cum_ram_flush')}</span><span class="cv">${c.fl_ram}</span>`
          +  `<span class="ck" data-tip="${t('cum_ic_sync_tip')}">${t('cum_ic_sync')}</span><span class="cv">${c.ic}</span>`;
  }

  counts.innerHTML = chtml;
}

/* ── Polling ──────────────────────────────────────── */
async function poll(){
  try {
    const r = await fetch('/api/stats');
    if (!r.ok) return;
    const d = await r.json();

    if (d.fps_x10 != null) {
      const raw = d.fps_x10 / 10;
      fpsEma = fpsEma > 0 ? fpsEma + FPS_ALPHA * (raw - fpsEma) : raw;
      $('fps').textContent = fpsEma.toFixed(1);
    } else {
      $('fps').textContent = '--';
    }
    $('heap').textContent = d.heap_kb ?? '--';
    $('snd').textContent = d.snd_us != null ? d.snd_us : '--';
    $('i2s_buf').textContent = (d.i2s_queued != null && d.i2s_total != null)
      ? d.i2s_queued + '/' + d.i2s_total
      : '--';
    $('acq').textContent = d.acquire && d.acquire.avg != null ? d.acquire.avg : '--';

    /* Synthesize cpu_only = cpu - render */
    if (d.cpu && d.cpu.avg !== undefined) {
      const rAvg = (d.render && d.render.avg) || 0;
      const rP99 = (d.render && d.render.p99) || 0;
      d.cpu_only = {avg: Math.max(0, d.cpu.avg - rAvg), p99: Math.max(0, d.cpu.p99 - rP99)};
    }

    /* Determine active series on first data */
    if (activeSeries.length === 0) {
      activeSeries = SERIES.filter(s => d[s.key] && d[s.key].avg !== undefined);
      buildLegend();
    }

    /* Build history point */
    const pt = {ts: Date.now()};
    for (const s of activeSeries) {
      pt[s.key] = d[s.key] ? d[s.key].avg : 0;
    }

    drawChart();
  } catch(e){}
}

const CTRL_KEY_MAP = {
  'KeyZ':'0','KeyX':'1','Backspace':'2','Enter':'3',
  'ArrowRight':'4','ArrowLeft':'5','ArrowUp':'6','ArrowDown':'7',
  'KeyA':'8','KeyS':'9','KeyJ':'0','KeyK':'1'
};
let ctrlWs = null, ctrlKeys = 0, ctrlPingTimer = null;

/* ── Toggle panel ── */
$('ctrl_enable').addEventListener('change', function(){

/* ── Gamepad WS (input control) ── */
function ctrlWsConnect(){
  if (ctrlWs) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ctrlWs = new WebSocket(proto + '//' + location.host + '/ws');
  ctrlWs.binaryType = 'arraybuffer';
  ctrlWs.onopen = () => {
    $('ws_status').textContent = t('ws_connected');
    $('ws_status').className = 'ws-status ok';
    ctrlPingTimer = setInterval(ctrlSendPing, 2000);
  };
  ctrlWs.onclose = () => {
    $('ws_status').textContent = t('ws_disconnected');
    $('ws_status').className = 'ws-status err';
    clearInterval(ctrlPingTimer);
    ctrlWs = null;
    if ($('ctrl_enable').checked) setTimeout(ctrlWsConnect, 2000);
  };
  ctrlWs.onerror = () => { if(ctrlWs) ctrlWs.close(); };
  ctrlWs.onmessage = () => {};
}

function ctrlWsDisconnect(){
  clearInterval(ctrlPingTimer);
  if (ctrlWs) { ctrlWs.onclose = null; ctrlWs.close(); ctrlWs = null; }
  $('ws_status').textContent = 'WS: --';
  $('ws_status').className = 'ws-status';
}

function ctrlSendKeys(){
  if (!ctrlWs || ctrlWs.readyState !== 1) return;
  const buf = new Uint8Array(7);
  buf[0] = 0x01;
  buf[1] = ctrlKeys & 0xFF;
  buf[2] = (ctrlKeys >> 8) & 0xFF;
  const ts = performance.now() & 0xFFFFFFFF;
  buf[3] = ts & 0xFF; buf[4] = (ts>>8)&0xFF; buf[5] = (ts>>16)&0xFF; buf[6] = (ts>>24)&0xFF;
  ctrlWs.send(buf.buffer);
}

function ctrlSendPing(){
  if (!ctrlWs || ctrlWs.readyState !== 1) return;
  const buf = new Uint8Array(5);
  buf[0] = 0x02;
  const ts = performance.now() & 0xFFFFFFFF;
  buf[1] = ts & 0xFF; buf[2] = (ts>>8)&0xFF; buf[3] = (ts>>16)&0xFF; buf[4] = (ts>>24)&0xFF;
  ctrlWs.send(buf.buffer);
}

function ctrlSetKey(bit, pressed){
  const prev = ctrlKeys;
  if (pressed) ctrlKeys |= (1 << bit); else ctrlKeys &= ~(1 << bit);
  const el = $('ck'+bit);
  if (el) el.classList.toggle('active', !!(ctrlKeys & (1<<bit)));
  if (ctrlKeys !== prev) ctrlSendKeys();
}

/* Touch / mouse for gamepad buttons */
document.querySelectorAll('#ctrl_card [data-key]').forEach(el => {
  const bit = parseInt(el.dataset.key);
  el.addEventListener('touchstart', e => { e.preventDefault(); ctrlSetKey(bit, true); });
  el.addEventListener('touchend', e => { e.preventDefault(); ctrlSetKey(bit, false); });
  el.addEventListener('touchcancel', e => { e.preventDefault(); ctrlSetKey(bit, false); });
  el.addEventListener('mousedown', e => { e.preventDefault(); ctrlSetKey(bit, true); });
  el.addEventListener('mouseup', e => { e.preventDefault(); ctrlSetKey(bit, false); });
  el.addEventListener('mouseleave', e => { ctrlSetKey(bit, false); });
});

  const bit = CTRL_KEY_MAP[e.code];

  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
ctrlCard.addEventListener('keyup', e => {

const frameCvs = $('frame_cvs');
const frameCtx = frameCvs.getContext('2d');
const frameImgData = frameCtx.createImageData(240, 160);
let frameBusy = false;

function renderRGB565(buf) {
  const src = new Uint16Array(buf);
  const dst = frameImgData.data;
  for (let i = 0, j = 0; i < src.length; i++, j += 4) {
    const px = src[i];
    dst[j]     = (px >> 8) & 0xF8;
    dst[j + 1] = (px >> 3) & 0xFC;
    dst[j + 2] = (px << 3) & 0xF8;
    dst[j + 3] = 255;
  }
  frameCtx.putImageData(frameImgData, 0, 0);
}

async function captureFrame(){
  if (frameBusy) return;
  frameBusy = true;
  const t0 = performance.now();
  try {

      $('frame_info').textContent = t('frame_size_err') + abuf.byteLength;
      return;
    }
    renderRGB565(abuf);
    const ms = (performance.now() - t0).toFixed(0);
    $('frame_info').textContent = (abuf.byteLength / 1024).toFixed(1) + ' KB | ' + ms + ' ms';
  } catch(e){
    $('frame_info').textContent = t('net_error');
  } finally {
    frameBusy = false;
  }
}

/* ── H.264 Stream via WebSocket (WebCodecs / Broadway.js) ── */
let streamWs = null;
let videoDecoder = null;   /* WebCodecs VideoDecoder (secure ctx only) */
let broadwayPlayer = null; /* Broadway.js fallback */
let useBroadway = false;
let audioCtx = null;
let streamActive = false;
let streamFrames = 0;
let streamStartTime = 0;
let streamVidMsgs = 0;
let streamAudMsgs = 0;
let streamDecErr = '';
let streamAudioTime = 0;
let streamAudioQueue = [];       /* buffered AudioBuffers before playback starts */
let streamAudioPrimed = false;   /* true once initial buffer is drained */

/* Audio bus — all BufferSources connect here, then to destination.
 * Recording taps this node via MediaStreamDestination. */
let audioGain = null;

/* Recording state */
let mediaRecorder = null;
let recordChunks = [];
let recAudioDest = null;  /* MediaStreamDestinationNode while recording */

const BROADWAY_CDN = 'https://cdn.jsdelivr.net/npm/broadway-player@0.1.1/Player';
let broadwayLoaded = false;

function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = () => reject(new Error(t('script_load_fail') + url));
    document.head.appendChild(s);
  });
}

async function initBroadway() {
  if (!broadwayLoaded) {
    await loadScript(BROADWAY_CDN + '/Decoder.js');
    await loadScript(BROADWAY_CDN + '/YUVCanvas.js');
    await loadScript(BROADWAY_CDN + '/Player.js');
    broadwayLoaded = true;
  }
  broadwayPlayer = new Player({
    useWorker: false,
    webgl: 'auto',
    size: { width: 240, height: 160 }
  });
  broadwayPlayer.onRenderFrameComplete = function() {
    frameCtx.drawImage(broadwayPlayer.canvas, 0, 0, 240, 160);
  };
}

function streamStart() {
  if (streamActive) return;
  streamActive = true;
  streamFrames = 0;
  streamVidMsgs = 0;
  streamAudMsgs = 0;
  streamDecErr = '';
  streamAudioTime = 0;
  streamAudioQueue = [];
  streamAudioPrimed = false;
  useBroadway = false;
  streamStartTime = performance.now();
  $('stream_btn').querySelector('[data-i18n]').dataset.i18n = 'stream_stop';
  $('stream_btn').querySelector('[data-i18n]').textContent = t('stream_stop');
  $('stream_btn').classList.add('on');
  $('stream_info').textContent = t('connecting');
  $('frame_info').textContent = t('init_decoder');

  /* Init AudioContext at GBA's native 65536 Hz.  This matches the
   * createBuffer sample rate exactly — zero resampling in WebAudio.
   * OS audio stack handles the final 65536→hardware rate conversion. */
  if (!audioCtx) {
    audioCtx = new AudioContext({ sampleRate: 65536 });
    audioGain = audioCtx.createGain();
    audioGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  /* Connect to stream WS first, then init decoder, then send reset.
   * This guarantees the backend receives 0x20 only after the frontend
   * decoder is fully ready to consume the first IDR frame. */
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  streamWs = new WebSocket(proto + '//' + location.host + '/ws/stream');
  streamWs.binaryType = 'arraybuffer';
  streamWs.onopen = async () => {
    $('stream_info').textContent = t('init_decoder');

    /* Init video decoder */
    let decoderOk = false;
    if ('VideoDecoder' in window) {
      videoDecoder = new VideoDecoder({
        output: onVideoFrame,
        error: e => {
          console.error('VideoDecoder error:', e);
          streamDecErr = '' + e;
          $('frame_info').textContent = t('decoder_error') + e.message;
        },
      });
      videoDecoder.configure({
        codec: 'avc3.42001e',
        codedWidth: 240,
        codedHeight: 160,
        optimizeForLatency: true,
      });
      decoderOk = true;
      $('frame_info').textContent = t('webcodecs_ready');
    } else {
      $('frame_info').textContent = t('loading_broadway');
      try {
        await initBroadway();
        useBroadway = true;
        decoderOk = true;
        $('frame_info').textContent = t('broadway_ready');
      } catch(e) {
        $('frame_info').textContent = t('broadway_fail') + e.message;
        console.error('Broadway init failed:', e);
      }
    }

    if (decoderOk && streamWs && streamWs.readyState === 1) {
      /* Send reset command (0x20) — backend will reset encoder
       * to produce IDR as first frame and start streaming task */
      streamWs.send(new Uint8Array([0x20]).buffer);
      $('stream_info').textContent = t('streaming');
    }
  };
  streamWs.onclose = () => {
    $('stream_info').textContent = t('disconnected');
    streamStop();
  };
  streamWs.onerror = () => {
    if (streamWs) streamWs.close();
  };
  streamWs.onmessage = onStreamMessage;
}

function streamStop() {
  streamActive = false;
  $('stream_btn').querySelector('[data-i18n]').dataset.i18n = 'stream_start';
  $('stream_btn').querySelector('[data-i18n]').textContent = t('stream_start');
  $('stream_btn').classList.remove('on');

  if (streamWs) {
    /* Send stop command */
    try {
      const stop = new Uint8Array([0x10]);
      streamWs.send(stop.buffer);
    } catch(e) {}
    streamWs.onclose = null;
    streamWs.close();
    streamWs = null;
  }

  if (videoDecoder && videoDecoder.state !== 'closed') {
    try { videoDecoder.close(); } catch(e) {}
    videoDecoder = null;
  }

  if (broadwayPlayer) {
    broadwayPlayer = null;
    useBroadway = false;
  }

  /* Stop recording if active */
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

function onStreamMessage(evt) {
  const data = new Uint8Array(evt.data);
  if (data.length < 2) return;

  const msgType = data[0];

  if (msgType === 0x01) {
    /* Video: [0]=0x01 [1]=frame_type [2..5]=pts [6..]=NAL */
    streamVidMsgs++;
    const frameType = data[1]; /* 0=IDR, 2=P */
    const nalData = data.slice(6);
    const isKey = frameType <= 1;

    if (videoDecoder && videoDecoder.state !== 'closed') {
      /* ── WebCodecs path ── */
      try {
        const chunk = new EncodedVideoChunk({
          type: isKey ? 'key' : 'delta',
          timestamp: streamFrames * (1000000 / 30), /* µs */
          data: nalData,
        });
        videoDecoder.decode(chunk);
        streamFrames++;
      } catch(e) {
        console.warn('VideoDecoder decode error:', e);
        $('frame_info').textContent = t('decode_err') + e.message;
      }
    } else if (broadwayPlayer && useBroadway) {
      /* ── Broadway.js path ── */
      try {
        broadwayPlayer.decode(nalData);
        streamFrames++;
      } catch(e) {
        console.warn('Broadway decode error:', e);
        $('frame_info').textContent = t('broadway_decode_err') + e.message;
      }
    } else {
      $('frame_info').textContent = t('decoder_init');
      return;
    }

    /* Update info every 10 frames */
    const elapsed = (performance.now() - streamStartTime) / 1000;
    if (elapsed > 0 && (streamFrames % 10 === 0)) {
      const fps = (streamFrames / elapsed).toFixed(1);
      const kbps = ((nalData.length * 8 * 30) / 1000).toFixed(0);
      $('stream_info').textContent = fps + ' fps | ' + kbps + ' kbps';
    }
    if (streamFrames % 10 === 0) {
      $('frame_info').textContent = nalData.length + 'B ' + (isKey ? 'IDR' : 'P') +
        (useBroadway ? ' [Broadway]' : ' [WebCodecs]');
    }
  } else if (msgType === 0x02 && audioCtx) {
    /* Audio: [0]=0x02 [1]=pad [2..5]=pts [6..9]=sample_count [10..]=s16 stereo */
    streamAudMsgs++;
    if (data.length < 11) return;
    const dv = new DataView(evt.data);
    const sampleCount = dv.getUint32(6, true);
    if (sampleCount === 0 || data.length < 10 + sampleCount * 4) return;

    /* Convert s16 stereo to float32 AudioBuffer, schedule gaplessly */
    const buf = audioCtx.createBuffer(2, sampleCount, 65536);
    const chL = buf.getChannelData(0);
    const chR = buf.getChannelData(1);
    const pcm = new Int16Array(evt.data, 10, sampleCount * 2);
    for (let i = 0; i < sampleCount; i++) {
      chL[i] = pcm[i * 2]     / 32768.0;
      chR[i] = pcm[i * 2 + 1] / 32768.0;
    }

    /* Buffer 3 chunks (~100ms at 30 audio/sec) before starting playback.
     * This absorbs network jitter without adding excessive latency. */
    if (!streamAudioPrimed) {
      streamAudioQueue.push(buf);
      if (streamAudioQueue.length < 3) return;
      /* Prime: schedule all queued chunks starting from now */
      streamAudioPrimed = true;
      streamAudioTime = audioCtx.currentTime;
      for (const qbuf of streamAudioQueue) {
        const src = audioCtx.createBufferSource();
        src.buffer = qbuf;
        src.connect(audioGain);
        src.start(streamAudioTime);
        streamAudioTime += qbuf.length / 65536;
      }
      streamAudioQueue = [];
      return;
    }

    /* Steady state: schedule at the exact next position on the
     * audio timeline.  If we fall behind (underrun), re-anchor to
     * slightly ahead of "now" so WebAudio always has a small
     * scheduling cushion.  This may produce a brief silence gap
     * but is inaudible and keeps the stream gapless going forward. */
    const ahead = streamAudioTime - audioCtx.currentTime;
    if (ahead < -0.02) {
      streamAudioTime = audioCtx.currentTime + 0.04; /* 40ms cushion */
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioGain);
    src.start(streamAudioTime);
    streamAudioTime += sampleCount / 65536;
  }
}

function onVideoFrame(frame) {
  frameCtx.drawImage(frame, 0, 0, 240, 160);
  frame.close();
}

$('stream_btn').addEventListener('click', () => {
  if (streamActive) streamStop(); else streamStart();
});

/* ── Volume control ── */
(function(){
  const slider = $('vol_slider'), valEl = $('vol_val');
  const saved = localStorage.getItem('gpsp_vol');
  if (saved !== null) { slider.value = saved; valEl.textContent = saved; }
  slider.addEventListener('input', function(){
    valEl.textContent = this.value;
    localStorage.setItem('gpsp_vol', this.value);
    if (audioGain) audioGain.gain.value = this.value / 100;
  });
  /* Apply saved volume when audioGain is first created */
  const origStart = streamStart;
  streamStart = function(){
    origStart();
    if (audioGain) audioGain.gain.value = slider.value / 100;
  };
})();

/* ── Recording via MediaRecorder (canvas capture) ── */
$('rec_btn').addEventListener('click', function() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }

  /* Capture canvas as media stream */
  const stream = frameCvs.captureStream(30);

  /* Add audio track from the gain bus */
  if (audioCtx && audioGain && audioCtx.state === 'running') {
    try {
      recAudioDest = audioCtx.createMediaStreamDestination();
      audioGain.connect(recAudioDest);
      for (const track of recAudioDest.stream.getAudioTracks()) {
        stream.addTrack(track);
      }
    } catch(e) { recAudioDest = null; }
  }

  /* Prefer vp9+opus when audio track is present */
  let mimeType = 'video/webm;codecs=vp9,opus';
  if (!MediaRecorder.isTypeSupported(mimeType)) {
    mimeType = 'video/webm;codecs=vp9';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
  }
  const opts = { mimeType };

  recordChunks = [];
  try {
    mediaRecorder = new MediaRecorder(stream, opts);
  } catch(e) {
    $('frame_info').textContent = t('record_unavail');
    return;
  }

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordChunks.push(e.data);
  };
  mediaRecorder.onstop = () => {
    /* Disconnect audio tap */
    if (recAudioDest) {
      try { audioGain.disconnect(recAudioDest); } catch(e) {}
      recAudioDest = null;
    }
    $('rec_btn').querySelector('[data-i18n]') && ($('rec_btn').querySelector('[data-i18n]').textContent = t('record'));
    $('rec_btn').classList.remove('rec');
    /* Download the recorded file */
    const blob = new Blob(recordChunks, { type: opts.mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gpsp_' + new Date().toISOString().slice(0,19).replace(/[:-]/g,'') + '.webm';
    a.click();
    URL.revokeObjectURL(url);
    recordChunks = [];
    mediaRecorder = null;
  };

  mediaRecorder.start(1000); /* 1s timeslice */
  $('rec_btn').querySelector('[data-i18n]') && ($('rec_btn').querySelector('[data-i18n]').textContent = t('record_stop'));
  $('rec_btn').classList.add('rec');
});

})();
</script>
</body>
</html>
